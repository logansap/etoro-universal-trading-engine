[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "etoro-universal-trading-engine"
version = "0.9.0rc5"
description = "YAML-configured, broker-authoritative trading engine for eToro (simulation and shadow only; live not implemented)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML==6.0.3",
    "numpy==2.4.6",
    "pandas==3.0.3",
    "tzdata>=2025.2",
    "websockets==16.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
trading-engine = "utengine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"utengine.strategy_modules.vendor" = ["*.py", "tsr_frozen/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
