# eToro Universal Trading Engine -- MULTI-STRATEGY configuration: the owner's 50/50 target (#529 eToro-restricted +
# #60-SQQQ) on one account. Same safety rules as engine.yaml (shadow; live refused). Docs: docs/MULTI_STRATEGY_ARCHITECTURE.md.
# Safety is enforced in code: runtime.mode accepts only simulation|shadow, security.live_execution_enabled must be
# false, and no live writer exists in this release. Editing this file cannot enable live trading.
schema_version: 1
engine:
  instance_id: ute-multi-rc1
  description: "Multi-strategy 50/50 shadow configuration -- live NOT enabled"
broker:
  name: etoro
  access: live_read_only            # the eToro adapter has no write methods
  api_base: https://public-api.etoro.com
  credentials_env:                  # NAMES of environment variables (owner-provisioned READ-ONLY key); never values
    api_key: UTE_ETORO_READONLY_API_KEY
    user_key: UTE_ETORO_READONLY_USER_KEY
  request_timeout_seconds: 10
account:
  ownership: exclusive              # all broker cash belongs to this engine; foreign positions are excluded
  equity_source: broker
  base_currency: USD
  deposit_detection: automatic
  unknown_balance_policy: halt
  cash_tolerance_usd: 0.05
  pre_existing_positions: exclude_and_report
  external_trade_policy: halt
  max_broker_state_age_seconds: 300
runtime:
  mode: shadow                      # simulation | shadow   (live is refused)
  initial_strategy: QC_60_SQQQ      # used ONLY at the first start of an empty database
  strategies_dir: strategies
  cycle_interval_seconds: 60
security:
  live_execution_enabled: false
  approvals_required: true
reconciliation:
  before_decision: true
  before_execution: true
  after_execution: true
  after_restart: true
  order_poll_seconds: 2
  order_poll_attempts: 15
risk:
  max_gross_exposure: 1.0
  max_instrument_weight: 1.0
  max_leverage: 1
  allow_short: false
  daily_loss_halt_pct: 0.20         # NEW_EXPOSURE halt (never a liquidation); 3x ETFs move 10%+ in a day
  drawdown_halt_pct: 0.50
  max_single_order_usd: 25000       # catastrophic-bug backstop, not a sizing rule
  min_order_usd: 10                 # eToro minimum position
  max_quote_age_seconds: 120
  halt_allows_reductions: false
market_data:
  provider: yahoo                   # free Yahoo chart endpoint for shadow decisions
  lookback_sessions: 760
  simulation_half_spread_bp: 2.0
monitoring:
  heartbeat_stale_seconds: 300
notifications:
  webhook_url_env: UTE_ALERT_WEBHOOK_URL   # NAME of the env var holding the webhook URL (unset = outbox file only)
  min_severity: WARNING
  dedupe_minutes: 60
  timeout_seconds: 10
  max_attempts: 10
backup:
  local_dir: backups                # relative to UTE_HOME
  retain: 14
  offsite_method: none              # none | copy (remote mounted at /mnt/etoro-ute-offsite) | rsync (user@host:path); owner approval
  offsite_target_env: UTE_BACKUP_OFFSITE_TARGET
calendar:
  exchange: XNYS
  timezone: America/New_York
  unscheduled_closures: ["2025-01-09"]
capital:
  ownership: full_designated_account      # after an approved takeover the engine owns 100% of this trading account
  sizing_source: verified_broker_equity   # broker cash + broker-valued positions only; never a typed budget
  manual_capital_amount: null             # refused if set
  funding_policy: automatic_evidence_backed   # evidence-matched deposits allocated automatically; else suspense
  external_flow_allocation: proportional  # verified net new capital split by the sleeve weights
  preserve_strategy_cash: true            # a deposit never redistributes a sleeve's existing profits or cash
portfolio:
  mode: multi_strategy              # used at the FIRST start only; later changes via `portfolio reallocate`
  sleeves:
    - strategy: QC_529_ETORO_RESTRICTED
      weight: 0.50
    - strategy: QC_60_SQQQ
      weight: 0.50
  funding_policy: proportional      # deposits / withdrawals split by sleeve weight
  rebalance_policy: strategy_independent
  aggregate_risk: enforced          # engine risk limits apply to the combined broker exposure
  internal_crossing: true           # opposite sleeve trades in one instrument are transferred, not traded
takeover:
  known_writers:
    - name: gold-miner
      description: "live Gold Miner #687 engine on the VPS (owns the GDX CFD short); disabled only by the owner"
  approval_ttl_hours: 4
  price_tolerance_pct: 0.02
  close_slippage_bp: 25
  investable_reserve_pct: 0.02
  financing_annual_rate_observed:
    GDX: 0.1005                     # observed on Gold Miner's x5 GDX CFD (2026-08/09)
